name: WirePod
slug: wire-pod
version: "1.1.2.2"
description: Self-hosted cloud replacement server for unlocked Anki Vector robots
url: https://github.com/kercre123/wire-pod
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:robot
panel_title: WirePod
ports:
  443/tcp: 8443
ports_description:
  443/tcp: Robot TLS/gRPC endpoint (Vector's self-signed-cert-pinned connection; default host port 8443)
watchdog: "http://[HOST]:[PORT:8080]/ok"
options:
  stt_service: vosk
  stt_language: en-US
  debug_logging: true
  use_inbuilt_ble: false
  picovoice_apikey: ""
schema:
  stt_service: "list(vosk|whisper|whisper.cpp|coqui|leopard|rhino|houndify)"
  stt_language: str
  debug_logging: bool
  use_inbuilt_ble: bool
  picovoice_apikey: password?
