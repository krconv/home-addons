name: WirePod
slug: wire-pod
version: "1.1.2.4"
description: Self-hosted cloud replacement server for unlocked Anki Vector robots
url: https://github.com/kercre123/wire-pod
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
ports:
  8080/tcp: 8080
  8443/tcp: 8443
ports_description:
  8080/tcp: wire-pod web setup UI (must be accessed directly, not via ingress — see README)
  8443/tcp: Robot TLS/gRPC endpoint — set wire-pod's own server port to 8443 in its settings UI (see README)
watchdog: "http://[HOST]:[PORT:8080]/ok"
options:
  stt_service: vosk
  stt_language: en-US
  debug_logging: true
  use_inbuilt_ble: false
  picovoice_apikey: ""
schema:
  stt_service: "list(vosk|whisper|whisper.cpp|coqui|leopard|rhino|houndify)"
  stt_language: str
  debug_logging: bool
  use_inbuilt_ble: bool
  picovoice_apikey: password?
