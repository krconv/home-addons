name: WirePod
slug: wire-pod
version: "1.1.2.1"
description: Self-hosted cloud replacement server for unlocked Anki Vector robots
url: https://github.com/kercre123/wire-pod
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
ports:
  80/tcp: 80
  443/tcp: 443
  8080/tcp: 8080
  8084/tcp: 8084
ports_description:
  80/tcp: Robot API (HTTP, default 80)
  443/tcp: Robot API (HTTPS/certs, default 443)
  8080/tcp: wire-pod web setup UI (default 8080)
  8084/tcp: jdocs service (default 8084)
watchdog: "http://[HOST]:[PORT:8080]/ok"
options:
  stt_service: vosk
  stt_language: en-US
  debug_logging: true
  use_inbuilt_ble: false
  picovoice_apikey: ""
schema:
  stt_service: "list(vosk|whisper|whisper.cpp|coqui|leopard|rhino|houndify)"
  stt_language: str
  debug_logging: bool
  use_inbuilt_ble: bool
  picovoice_apikey: password?
