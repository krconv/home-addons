name: Scripts add-on

on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/scripts.yaml"]
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/scripts.yaml"]

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install poetry==1.8.3
          poetry config virtualenvs.in-project true
          poetry install --only=main --no-interaction
          .venv/bin/pip install pytest matplotlib ruff
      - name: Lint
        run: .venv/bin/ruff check --select E9,F63,F7,F82 src tests
      - name: Unit tests and one-night simulation
        run: .venv/bin/python -m pytest -q tests
      - name: Scenario suite
        # Exits 1 on the known West Wing shortfalls, so the reports are the result to read.
        continue-on-error: true
        run: .venv/bin/python -m tests.hvac.sim.run all
      - uses: actions/upload-artifact@v4
        with:
          name: hvac-sim-reports
          path: scripts/tests/hvac/out/**/report.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.23 scripts

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Ask Home Assistant to install the update
        env:
          WEBHOOK: ${{ secrets.HA_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "HA_DEPLOY_WEBHOOK_URL is not set; Home Assistant picks the update up on its own schedule."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK"
